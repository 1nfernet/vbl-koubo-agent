[project]
name = "vbl-koubo-agent"
version = "0.1.0"
description = "基于 Agent Skills 架构的口播认知蒸馏与结构化生成引擎"
authors = [
    { name = "veretex", email = "binyu120@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "litellm>=1.40.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
vbl-koubo-agent = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

